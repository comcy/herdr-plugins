id = "hp.gh-watch"
name = "GH Watch"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Live GitHub Actions runs and open PRs with spinner"
platforms = ["linux", "macos"]

[[panes]]
id = "runs"
title = "Actions"
placement = "popup"
width = "80%"
height = "70%"
command = ["bash", "watch.sh", "runs"]

[[panes]]
id = "prs"
title = "PRs"
placement = "popup"
width = "80%"
height = "70%"
command = ["bash", "watch.sh", "prs"]

[[actions]]
id = "runs"
title = "Actions runs"
contexts = ["workspace"]
command = ["bash", "open.sh", "runs"]

[[actions]]
id = "prs"
title = "Open PRs"
contexts = ["workspace"]
command = ["bash", "open.sh", "prs"]
